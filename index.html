</head>

 const s=1+(pl.cargo>=4?1:0)+(got>=total*.65?1:0);SV.st[LI]=Math.max(SV.st[LI]||0,s);save();ended='x';const last=LI==RUTA.length-1;
 show(`<div class="card"><h2>¡${L.a}!</h2><div class="stars">${ST(s)}</div><p>Cajas salvadas: <b>${pl.cargo} de 5</b><br>Gafas recogidas: <b>${got} de ${total}</b></p><button class="go" id="b1">${last?'Ver el final':'Siguiente etapa'}</button><div class="row"><button class="sec" id="b2">Repetir</button><button class="sec" id="b3">Menú</button></div></div>`,'end');bt('b1',()=>last?ending():intro(LI+1));bt('b2',()=>play(LI));bt('b3',title)}

 if(mode=='play'){let d=dt;if(slow>0){slow-=dt;d*=.4}acc+=d;while(acc>=1/120&&mode=='play'){step(1/120);acc-=1/120}render();A.tick(mode=='play'?pl.vx:-1,L.modo,L.tema=='noche'?.05:L.modo=='fly'?.03:0)}

 if(wipe>0){wipe-=dt*1.3;g.setTransform(K,0,0,K,0,0);g.fillStyle='#06122b';g.beginPath();g.rect(0,0,W,H);g.arc(W/2,H/2,Math.max(0,(1-wipe))*W*.75,0,TAU,true);g.fill()}}

title();requestAnimationFrame(loop);
